name: check
on:
  pull_request:
  workflow_call:
  push:
    branches: [main, beta]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_TOKEN }}
      - run: nix flake check --show-trace
