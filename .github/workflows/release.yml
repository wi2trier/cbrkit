name: release
on:
  workflow_dispatch:
jobs:
  check:
    uses: $/.github/workflows/check.yml
    secrets: inherit
  release:
    if: ${{ github.repository_owner == 'wi2trier' }}
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: release
      url: https://github.com/wi2trier/cbrkit/releases/tag/${{ steps.semanticrelease.outputs.git-tag }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semanticrelease.outputs.version }}
      released: ${{ steps.semanticrelease.outputs.released }}
      git-head: ${{ steps.semanticrelease.outputs.git-head }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_TOKEN }}
      - run: nix profile install .#release-env
      - uses: cihelper/action-semanticrelease-uv@v1
        id: semanticrelease
        with:
          uv-publish: false
      - uses: actions/upload-artifact@v7
        if: ${{ steps.semanticrelease.outputs.released == 'true' }}
        with:
          name: uv-build
          path: ./dist
  deploy-pypi:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      id-token: write
    environment:
      name: release
      url: https://pypi.org/project/cbrkit/${{ needs.release.outputs.version }}/
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: uv-build
          path: ./dist
      - uses: astral-sh/attest-action@v0.0.6
      - run: uv publish
  build-docs:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
      pages: read
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.git-head }}
      - uses: actions/configure-pages@v6
      - uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_TOKEN }}
      - run: nix build .#docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./result
  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
