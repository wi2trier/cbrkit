[project]
name = "cbrkit"
version = "1.7.1"
description = "Customizable Case-Based Reasoning (CBR) toolkit for Python with a CLI, REST API and MCP server"
readme = "README.md"
requires-python = ">=3.14,<4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
keywords = [
  "api",
  "case-based reasoning",
  "cbr",
  "cli",
  "mcp",
  "retrieval",
  "similarity",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "filelock>=4,<5",
  "griffelib>=2,<3",
  "numpy>=2,<3",
  "orjson>=3,<4",
  "polars>=2,<3",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3,<4",
  "scipy>=1,<2",
]

[project.urls]
Changelog = "https://github.com/wi2trier/cbrkit/releases"
Documentation = "https://wi2trier.github.io/cbrkit/"
Issues = "https://github.com/wi2trier/cbrkit/issues"
Repository = "https://github.com/wi2trier/cbrkit"

[project.scripts]
cbrkit = "cbrkit.cli:app"

[project.optional-dependencies]
# Language and embedding models
http = ["httpx2>=2,<3"]
pydantic-ai = ["pydantic-ai-slim>=2,<3"]

# NLP / text processing
bm25 = ["bm25s[core,stem,indexing]>=0.3,<0.4"]

# ML / embeddings
transformers = ["sentence-transformers>=6,<7"]

# Graphs
bpmn = ["xsdata>=26,<27"]
graphs = ["networkx>=3,<4", "rustworkx>=0.18,<0.19"]
graphviz = ["pygraphviz>=2,<3"]

# Data
fastexcel = ["fastexcel>=0.21,<0.22"]
lancedb = ["lancedb>=0.41,<0.42"]
pgvector = ["pgvector>=0.5,<0.6", "cbrkit[sql]"]
sql = ["sqlalchemy[asyncio]>=2,<3"]
sqlite-vec = ["sqlite-vec>=0.1,<0.2", "aiosqlite>=0.22,<0.23", "cbrkit[sql]"]
zvec = ["zvec>=0.8,<0.9"]

# Entry points
api = ["fastapi>=0.163,<0.164", "uvicorn>=0.54,<0.55", "cbrkit[cli]"]
cli = ["typer>=0.29,<0.30"]
mcp = ["fastmcp>=4,<5", "cbrkit[cli]"]

# Bundle
all = [
  "cbrkit[api,bm25,bpmn,cli,fastexcel,graphs,graphviz,http,lancedb,mcp,pgvector,pydantic-ai,sql,sqlite-vec,transformers,zvec]",
]

[dependency-groups]
dev = ["scipy-stubs>=1,<2", "types-networkx>=3,<4"]
docs = ["pdoc>=16,<17"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = [
  "--cov=src/cbrkit",
  "--cov-report=term-missing",
  "--doctest-glob=README.md",
  "--doctest-modules",
  "--import-mode=importlib",
]
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
testpaths = ["README.md", "src", "tests"]

[tool.basedpyright]
ignore = ["src/cbrkit/model/graph/_bpmn_schema"]

[tool.ruff]
extend-exclude = ["src/cbrkit/model/graph/_bpmn_schema"]

[tool.ruff.lint]
# lazy exports live in `if TYPE_CHECKING:` blocks that `cbrkit._lazy` resolves at runtime
ignore = ["TC004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
exclude = ["src/cbrkit/model/graph/_bpmn_schema"]

[tool.uv]
default-groups = ["dev", "test", "docs"]

[tool.uv.exclude-newer-package]
pydantic-ai-slim = "1 day"
pydantic-graph = "1 day"

[tool.uv.extra-build-dependencies]
pystemmer = ["setuptools", "cython"]
